<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="admin/fragments/admin-header :: head('Dashboard')"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->
    <nav th:replace="~{admin/fragments/admin-nav :: navbar}"></nav>

    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/admin-nav :: sidebar}"></div>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <!-- Content Header -->
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0">Dashboard</h1>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item active">Home</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main content -->
        <section class="content">
            <div class="container-fluid">
                <h5 th:text="'Welcome to ' + ${systemInfo?.get('name')} ?: 'CSMS'">Welcome</h5>
                <hr class="border-info">
                <div class="row">

                    <div class="col-12 col-sm-6 col-md-3">
                        <div class="info-box bg-light shadow">
                            <span class="info-box-icon bg-info elevation-1"><i class="fas fa-warehouse"></i></span>
                            <div class="info-box-content">
                                <span class="info-box-text">Active Storages</span>
                                <span class="info-box-number text-right" th:text="${activeStorageCount}">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-md-3">
                        <div class="info-box bg-light shadow">
                            <span class="info-box-icon bg-gradient-secondary elevation-1"><i class="fas fa-book"></i></span>
                            <div class="info-box-content">
                                <span class="info-box-text">Pending Bookings</span>
                                <span class="info-box-number text-right" th:text="${pendingBookingCount}">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-md-3">
                        <div class="info-box bg-light shadow">
                            <span class="info-box-icon bg-gradient-primary elevation-1"><i class="fas fa-book"></i></span>
                            <div class="info-box-content">
                                <span class="info-box-text">Confirmed Bookings</span>
                                <span class="info-box-number text-right" th:text="${approvedBookingCount}">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-md-3">
                        <div class="info-box bg-light shadow">
                            <span class="info-box-icon bg-gradient-secondary elevation-1"><i class="fas fa-question-circle"></i></span>
                            <div class="info-box-content">
                                <span class="info-box-text">Unread Inquiries</span>
                                <span class="info-box-number text-right" th:text="${unreadInquiryCount}">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-md-3">
                        <div class="info-box bg-light shadow">
                            <span class="info-box-icon bg-gradient-primary elevation-1"><i class="fas fa-question-circle"></i></span>
                            <div class="info-box-content">
                                <span class="info-box-text">Read Inquiries</span>
                                <span class="info-box-number text-right" th:text="${readInquiryCount}">0</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <div th:replace="admin/fragments/admin-footer :: footer"></div>
</div>

<div th:replace="admin/fragments/admin-footer :: scripts"></div>
</body>
</html>
