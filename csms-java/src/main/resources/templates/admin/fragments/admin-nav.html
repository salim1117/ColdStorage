<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Top Navbar -->
<nav class="main-header navbar navbar-expand navbar-dark border border-info border-top-0 border-left-0 border-right-0 text-sm shadow-sm bg-primary" th:fragment="navbar">
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
        </li>
        <li class="nav-item d-none d-sm-inline-block">
            <a href="/admin" class="nav-link"><b th:text="${systemInfo?.get('name')} ?: 'CSMS'">CSMS - Admin</b></a>
        </li>
    </ul>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item">
            <div class="btn-group nav-link">
                <button type="button" class="btn btn-rounded badge badge-light dropdown-toggle dropdown-icon" data-toggle="dropdown">
                    <span><img src="https://via.placeholder.com/160" class="img-circle elevation-2 user-img" alt="User Image" style="position: absolute; height: 27px; width: 27px; object-fit: cover; left: -7%; top: -12%;"></span>
                    <span class="ml-3" sec:authentication="name">Admin</span>
                    <span class="sr-only">Toggle Dropdown</span>
                </button>
                <div class="dropdown-menu" role="menu">
                    <a class="dropdown-item" href="/admin/users/manage"><span class="fa fa-user"></span> My Account</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" href="/logout"><span class="fas fa-sign-out-alt"></span> Logout</a>
                </div>
            </div>
        </li>
    </ul>
</nav>

<!-- Main Sidebar Container -->
<aside class="main-sidebar sidebar-dark-primary elevation-4" th:fragment="sidebar">
    <!-- Brand Logo -->
    <a href="/admin" class="brand-link">
        <img th:src="@{/uploads/__${systemInfo?.get('logo')}__}" onerror="this.src='https://via.placeholder.com/50'" alt="Logo"
             class="brand-image img-circle elevation-3" style="opacity:.8">
        <span class="brand-text font-weight-light" th:text="${systemInfo?.get('short_name')} ?: 'CSMS'">CSMS</span>
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
        <!-- Sidebar user panel -->
        <div class="user-panel mt-3 pb-3 mb-3 d-flex">
            <div class="image">
                <img src="https://via.placeholder.com/160" class="img-circle elevation-2" alt="User Image">
            </div>
            <div class="info">
                <a href="#" class="d-block" sec:authentication="name">Admin</a>
            </div>
        </div>

        <!-- Sidebar Menu -->
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                <li class="nav-item">
                    <a href="/admin" class="nav-link">
                        <i class="nav-icon fas fa-tachometer-alt"></i>
                        <p>Dashboard</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/admin/storages" class="nav-link">
                        <i class="nav-icon fas fa-warehouse"></i>
                        <p>Storages</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/admin/bookings" class="nav-link">
                        <i class="nav-icon fas fa-book"></i>
                        <p>Bookings</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/admin/users" class="nav-link">
                        <i class="nav-icon fas fa-users"></i>
                        <p>Users</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/admin/inquiries" class="nav-link">
                        <i class="nav-icon fas fa-envelope"></i>
                        <p>Inquiries</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/admin/system" class="nav-link">
                        <i class="nav-icon fas fa-cog"></i>
                        <p>System Info</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/logout" class="nav-link text-danger">
                        <i class="nav-icon fas fa-sign-out-alt"></i>
                        <p>Logout</p>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</aside>
</body>
</html>
