<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-header :: head('Manage Storage')}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->
    <nav th:replace="~{admin/fragments/admin-nav :: navbar}"></nav>

    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/admin-nav :: sidebar}"></div>

    <!-- Content Wrapper -->
    <div class="content-wrapper pt-3">
        <section class="content">
            <div class="container-fluid">
                <div class="card card-outline card-primary rounded-0 shadow">
                    <div class="card-header">
                        <h3 class="card-title" th:text="${storage.id == null ? 'Add New Storage' : 'Update Storage Details'}">Manage Storage</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/storages/manage}" method="post" enctype="multipart/form-data" id="storage-form">
                            <input type="hidden" name="id" th:value="${storage.id}">
                            
                            <div class="form-group">
                                <label for="name" class="control-label">Name</label>
                                <input type="text" name="name" id="name" class="form-control form-control-border" placeholder="Storage Name" th:value="${storage.name}" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="cost" class="control-label">Cost <small>(a day)</small></label>
                                <input type="number" step="0.01" name="cost" id="cost" class="form-control form-control-border text-right" placeholder="Storage Cost" th:value="${storage.cost}" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="description" class="control-label">Description</label>
                                <textarea rows="5" name="description" id="description" class="form-control form-control-border" placeholder="Write the storage description here." required th:text="${storage.description}"></textarea>
                            </div>
                            
                            <div class="row">
                                <div class="form-group col-md-6">
                                    <label for="thumbnail" class="control-label text-muted">Choose Image</label>
                                    <input type="file" id="thumbnail" name="thumbnail" class="form-control form-control-border" accept="image/png,image/jpeg" onchange="displayImg(this)">
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="form-group col-md-6 text-center">
                                    <img th:src="${storage.thumbnailPath != null ? '/uploads/' + storage.thumbnailPath : '/dist/img/no-image-available.png'}" alt="Cold Storage Image" id="cimg" class="bg-gradient-dark img-thumbnail" style="height:200px; width:200px; object-fit:scale-down;">
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="status" class="control-label">Status</label>
                                <select name="status" id="status" class="form-control form-control-border" required>
                                    <option value="1" th:selected="${storage.status == 1}">Available</option>
                                    <option value="0" th:selected="${storage.status == 0}">Unavailable</option>
                                </select>
                            </div>
                            
                            <div class="card-footer px-0">
                                <button type="submit" class="btn btn-primary btn-flat">Save Storage</button>
                                <a href="/admin/storages" class="btn btn-secondary btn-flat">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer th:replace="~{admin/fragments/admin-footer :: footer}"></footer>
</div>

<div th:replace="~{admin/fragments/admin-footer :: scripts}"></div>
<script>
    function displayImg(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
                $('#cimg').attr('src', e.target.result);
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
