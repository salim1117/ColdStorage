<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{admin/fragments/admin-header :: head('List of Storages')}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->
    <nav th:replace="~{admin/fragments/admin-nav :: navbar}"></nav>

    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/admin-nav :: sidebar}"></div>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0">Storages</h1>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="card card-outline card-primary rounded-0 shadow">
                    <div class="card-header">
                        <h3 class="card-title">List of Storages</h3>
                        <div class="card-tools">
                            <a href="/admin/storages/manage" class="btn btn-flat btn-sm btn-primary"><span class="fas fa-plus"></span> Add New Storage</a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid">
                            <table class="table table-hover table-striped data-table">
                                <colgroup>
                                    <col width="5%">
                                    <col width="20%">
                                    <col width="15%">
                                    <col width="25%">
                                    <col width="15%">
                                    <col width="10%">
                                    <col width="10%">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Date Created</th>
                                        <th>Image</th>
                                        <th>Name</th>
                                        <th>Cost</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="storage, stat : ${storages}">
                                        <td class="text-center" th:text="${stat.index + 1}">1</td>
                                        <td th:text="${storage.dateCreated != null ? #temporals.format(storage.dateCreated, 'yyyy-MM-dd HH:mm') : ''}">2024-12-15 10:15</td>
                                        <td class="text-center">
                                            <img th:src="@{'/uploads/' + ${storage.thumbnailPath}}" onerror="this.src='/dist/img/no-image-available.png'" alt="Storage Image" class="img-thumbnail bg-gradient-dark" style="width:100px; height:80px; object-fit:scale-down; object-position:center center;">
                                        </td>
                                        <td th:text="${storage.name}">Storage 101</td>
                                        <td class="text-right" th:text="${#numbers.formatDecimal(storage.cost, 1, 2)}">250.00</td>
                                        <td class="text-center">
                                            <span th:if="${storage.status == 1}" class="badge badge-success badge-pill">Available</span>
                                            <span th:if="${storage.status != 1}" class="badge badge-warning badge-pill">Unavailable</span>
                                        </td>
                                        <td align="center">
                                            <button type="button" class="btn btn-flat btn-default btn-sm dropdown-toggle dropdown-icon" data-toggle="dropdown">
                                                Action
                                                <span class="sr-only">Toggle Dropdown</span>
                                            </button>
                                            <div class="dropdown-menu" role="menu">
                                                <a class="dropdown-item" th:href="@{'/storages/' + ${storage.id}}"><span class="fa fa-eye text-dark"></span> View</a>
                                                <div class="dropdown-divider"></div>
                                                <a class="dropdown-item" th:href="@{'/admin/storages/manage?id=' + ${storage.id}}"><span class="fa fa-edit text-primary"></span> Edit</a>
                                                <div class="dropdown-divider"></div>
                                                <form th:action="@{/admin/storages/delete}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure to delete this storage permanently?');">
                                                    <input type="hidden" name="id" th:value="${storage.id}"/>
                                                    <button type="submit" class="dropdown-item"><span class="fa fa-trash text-danger"></span> Delete</button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer th:replace="~{admin/fragments/admin-footer :: footer}"></footer>
</div>

<div th:replace="~{admin/fragments/admin-footer :: scripts}"></div>
</body>
</html>
