<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-header :: head('Inquiry Details')}"></head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->
    <nav th:replace="~{admin/fragments/admin-nav :: navbar}"></nav>

    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/admin-nav :: sidebar}"></div>

    <!-- Content Wrapper -->
    <div class="content-wrapper pt-3">
        <section class="content">
            <div class="container-fluid">
                <div class="card card-outline card-info rounded-0">
                    <div class="card-header">
                        <h3 class="card-title">Inquiry Details</h3>
                    </div>
                    <div class="card-body">
                        <div class="container-fluid" th:if="${inquiry != null}">
                            <div class="row">
                                <div class="col-md-12">
                                    <dl>
                                        <dt class="text-primary">Inquirer</dt>
                                        <dd class="pl-4 fs-4 fw-bold" th:text="${inquiry.fullname}">John Doe</dd>
                                        
                                        <dt class="text-primary">Email</dt>
                                        <dd class="pl-4" th:text="${inquiry.email}">john@example.com</dd>
                                        
                                        <dt class="text-primary">Contact #</dt>
                                        <dd class="pl-4" th:text="${inquiry.contact}">09123456789</dd>
                                        
                                        <dt class="text-primary">Message</dt>
                                        <dd class="pl-4" style="white-space: pre-wrap;" th:text="${inquiry.message}">Message content goes here.</dd>
                                    </dl>
                                </div>
                            </div>
                            <hr>
                            <div class="row">
                                <div class="col-12 text-center">
                                    <a class="btn btn-flat btn-sm btn-dark" href="/admin/inquiries"><i class="fa fa-angle-left mr-1"></i>Back to List</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer th:replace="~{admin/fragments/admin-footer :: footer}"></footer>
</div>

<div th:replace="~{admin/fragments/admin-footer :: scripts}"></div>
</body>
</html>
