<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/admin-header :: head('Admin Login')"></head>
<body class="hold-transition login-page" style="background-size:cover;background-repeat:no-repeat;"
      th:style="'background-image:url(' + @{/uploads/__${systemInfo?.get('cover')}__} + ');background-size:cover;background-repeat:no-repeat;'">

<div class="login-box" style="margin-top:0;display:flex;min-height:100vh;max-width:100%;width:100%;">
    <!-- Left: Branding -->
    <div class="d-flex align-items-center justify-content-center" style="flex:1;flex-direction:column;">
        <img th:src="@{/uploads/__${systemInfo?.get('logo')}__}"
             onerror="this.src='https://via.placeholder.com/150'"
             alt="Logo" style="height:150px;width:150px;object-fit:contain;border-radius:50%;">
        <h1 class="text-white text-center py-4 font-weight-bold"
            style="text-shadow:2px 2px 4px black;"
            th:text="${systemInfo?.get('name')} + ' - Admin'">CSMS Admin</h1>
    </div>

    <!-- Right: Login Form -->
    <div class="d-flex align-items-center justify-content-center" style="flex:1;background:rgba(0,0,0,0.4);">
        <div class="card card-outline card-primary shadow" style="width:380px;border-radius:0;">
            <div class="card-header text-center" style="border-radius:0;">
                <h4 class="mb-0"><b>Login</b></h4>
            </div>
            <div class="card-body" style="border-radius:0;">
                <p th:if="${param.error}" class="alert alert-danger text-sm text-center">
                    Invalid username or password.
                </p>
                <p th:if="${param.logout}" class="alert alert-success text-sm text-center">
                    You have been logged out.
                </p>

                <form method="post" th:action="@{/admin/login}">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" name="username"
                               placeholder="Username" autofocus required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-user"></span>
                            </div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" class="form-control" name="password"
                               placeholder="Password" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-8 d-flex align-items-center">
                            <a href="/" class="text-muted">Go to Website</a>
                        </div>
                        <div class="col-4">
                            <button type="submit" class="btn btn-primary btn-block btn-flat">Sign In</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
</body>
</html>
