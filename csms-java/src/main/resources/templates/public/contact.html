<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="public/fragments/public-header :: head('Contact Us')"></head>
<body class="layout-top-nav layout-fixed layout-navbar-fixed" style="height:auto;">
<div class="wrapper">
    <div th:replace="public/fragments/public-nav :: topbar"></div>
    <div th:replace="public/fragments/public-nav :: navbar('contact')"></div>

    <div class="content-wrapper pt-5">
        <section class="content">
            <div class="container">
                <div class="col-12">
                    <div class="row my-5">
                        <!-- Contact Info -->
                        <div class="col-md-5">
                            <div class="card card-outline card-navy rounded-0 shadow">
                                <div class="card-header">
                                    <h4 class="card-title">Contact Information</h4>
                                </div>
                                <div class="card-body rounded-0">
                                    <dl>
                                        <dt class="text-muted"><i class="fa fa-envelope"></i> Email</dt>
                                        <dd class="pr-4" th:text="${systemInfo?.get('email')}">email@example.com</dd>
                                        <dt class="text-muted"><i class="fa fa-phone"></i> Contact #</dt>
                                        <dd class="pr-4" th:text="${systemInfo?.get('contact')}">+00 000 0000</dd>
                                        <dt class="text-muted"><i class="fa fa-map-marked-alt"></i> Location</dt>
                                        <dd class="pr-4" th:text="${systemInfo?.get('address')}">Address</dd>
                                    </dl>
                                </div>
                            </div>
                        </div>

                        <!-- Message Form -->
                        <div class="col-md-7">
                            <div class="card rounded-0 card-outline card-navy shadow">
                                <div class="card-body rounded-0">
                                    <h2 class="text-center">Message Us</h2>
                                    <center><hr class="bg-navy w-25"></center>

                                    <div th:if="${param.success}" class="alert alert-success">
                                        <i class="fa fa-check mr-2"></i> Your message has been sent successfully!
                                    </div>

                                    <form action="/contact" method="post" id="message-form">
                                        <div class="row mb-2">
                                            <div class="col-md-6">
                                                <input type="text" class="form-control form-control-sm"
                                                       name="fullname" required placeholder="John Smith">
                                                <small class="px-3 text-muted">Full Name</small>
                                            </div>
                                            <div class="col-md-6">
                                                <input type="text" class="form-control form-control-sm"
                                                       name="contact" required placeholder="Contact #">
                                                <small class="px-3 text-muted">Contact #</small>
                                            </div>
                                        </div>
                                        <div class="row mb-2">
                                            <div class="col-md-6">
                                                <input type="email" class="form-control form-control-sm"
                                                       name="email" required placeholder="you@example.com">
                                                <small class="px-3 text-muted">Email</small>
                                            </div>
                                        </div>
                                        <div class="row mb-2">
                                            <div class="form-group col-md-12">
                                                <small class="text-muted">Message</small>
                                                <textarea name="message" rows="4"
                                                          class="form-control form-control-sm rounded-0"
                                                          required placeholder="Write your message here"></textarea>
                                            </div>
                                        </div>
                                        <div class="text-center">
                                            <button type="submit"
                                                    class="btn btn-primary rounded-pill px-5">
                                                Send Message
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div th:replace="public/fragments/public-nav :: footer"></div>
</div>
</body>
</html>
