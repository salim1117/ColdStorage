<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | ' + ${systemInfo?.get('name')} ?: 'CSMS'">CSMS</title>
    <!-- Favicon -->
    <link rel="icon" th:href="@{/uploads/__${systemInfo?.get('logo')}__}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- AdminLTE -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Source Sans Pro', sans-serif; }
        #login-nav {
            position: fixed !important;
            top: 0 !important;
            z-index: 1037;
            padding: 0.3em 2.5em !important;
        }
        #top-Nav { top: 2.3em; position: fixed !important; z-index: 1036; width: 100%; }
        .content-wrapper { padding-top: 5.5em; }
        #top-Nav a.nav-link.active {
            color: #fff;
            font-weight: 900;
            position: relative;
        }
        #top-Nav a.nav-link.active:before {
            content: "";
            position: absolute;
            border-bottom: 2px solid #f8f9fa;
            width: 33.33%;
            left: 33.33%;
            bottom: 0;
        }
        #main-header {
            height: 70vh;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        #main-header:before {
            content: "";
            position: absolute;
            height: 100%;
            width: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            z-index: 0;
        }
        #main-header > div { position: relative; z-index: 2; }
        .site-title { color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    </style>
</head>
</html>
