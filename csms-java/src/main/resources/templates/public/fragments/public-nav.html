<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Top info bar -->
<div th:fragment="topbar">
    <nav class="w-100 px-2 py-1 bg-light text-dark" id="login-nav">
        <div class="d-flex justify-content-between w-100">
            <div>
                <span class="mr-2"><i class="fa fa-phone mr-1"></i>
                    <span th:text="${systemInfo?.get('contact')}">+00 000 000 0000</span>
                </span>
            </div>
            <div>
                <a href="/admin/login" class="mx-2 text-dark">Admin Login</a>
            </div>
        </div>
    </nav>
</div>

<!-- Main Navigation -->
<div th:fragment="navbar(page)">
    <nav class="main-header navbar navbar-expand navbar-dark bg-gradient-lightblue border-0 text-sm" id="top-Nav">
        <div class="container">
            <a href="/" class="navbar-brand">
                <img th:src="@{/uploads/__${systemInfo?.get('logo')}__}"
                     onerror="this.src='https://via.placeholder.com/40'"
                     alt="Logo" class="brand-image img-circle elevation-3" style="opacity:.8">
                <span th:text="${systemInfo?.get('short_name')} ?: 'CSMS'">CSMS</span>
            </a>

            <button class="navbar-toggler order-1" type="button"
                    data-toggle="collapse" data-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse order-3" id="navbarCollapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="/" th:class="'nav-link' + (${page} == 'home' ? ' active' : '')">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="/storages" th:class="'nav-link' + (${page} == 'storages' ? ' active' : '')">Storages</a>
                    </li>
                    <li class="nav-item">
                        <a href="/booking" th:class="'nav-link' + (${page} == 'booking' ? ' active' : '')">Booking</a>
                    </li>
                    <li class="nav-item">
                        <a href="/about" th:class="'nav-link' + (${page} == 'about' ? ' active' : '')">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a href="/contact" th:class="'nav-link' + (${page} == 'contact' ? ' active' : '')">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<!-- Footer -->
<div th:fragment="footer">
    <footer class="main-footer text-sm">
        <div class="container">
            <strong>Copyright &copy; <span th:text="${#dates.year(#dates.createNow())}">2024</span>.</strong>
            All rights reserved.
            <div class="float-right d-none d-sm-inline-block">
                <b th:text="${systemInfo?.get('name')} ?: 'CSMS'">CSMS</b>
            </div>
        </div>
    </footer>
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
</div>

</body>
</html>
