# Application
spring.application.name=CSMS Cold Storage Management System

# Server
server.port=8081

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/csms_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=king
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Paths are relative to csms-java/ when running mvn spring-boot:run.
app.upload.dir=../uploads
app.legacy.root=..

# Timezone
spring.jackson.time-zone=Asia/Kolkata

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Logging
logging.level.com.csms=INFO
logging.level.org.springframework.security=WARN
